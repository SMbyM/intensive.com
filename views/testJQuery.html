<!DOCTYPE html>
<html>
<head>
  <title>Мир jQuery</title>
  <script src="http://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
<h2>Добро пожаловать в мир jQuery</h2>

<form action="/" method="post">
  <input type="password" name="password" id="passwordField">
  <input type="checkbox" id="toggle">
  <input type="submit">
</form>
<button id="btn1">jQuery</button>
<button id="btn2" onclick="alert('Мир JavaScript'); ">JavaScript</button>

<script type="text/javascript">
  $(function(){
    $("#toggle").click(() => $("#passwordField").attr("type", $("#passwordField").attr("type") == "text" ? "password" : "text"));
  });
</script>s
