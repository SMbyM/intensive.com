<body>

    <script>
        async function getJson() {
            let response = await fetch("/usersnames");

            let json = await response.json();

            let usersNames = [];

            json.forEach(function(item){
                usersNames.push(item)
            })

            usersNames.forEach(function(item){
                console.log(item)
            })
        }

        getJson();

    </script>
