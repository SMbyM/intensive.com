<!doctype html>
<html>

<head>
    <meta charset UTF-8>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="src\css\чат.css">
    <link rel="shorcut icon" href="src\img\Иконка.ico" type="image/x-ico">
    <title> Сообщение </title>
</head>

<body>
    {{template "navbar".}}
    <div class="content">
        <div class="section1">
            <div class="aside">
                <a href="account.html">
                    <img src="src\img\Аватар.png" width="35" height="35">
                </a>
            </div>
            <h5 class="decrition1">
                Имя Фамилия
            </h5>
            <h6 class="decrition2">
                Никнейм
            </h6>
        </div>

        <div class="section2">
            <form action="/handler/" method="POST">
                <input type="message" name="message" class="message" placeholder="Введите сообщение...">
            </form>
            <a class="iksweb" href=" "> Отправить </a>
            <script>
                let form = document.querySelector('form');
                let button = document.querySelector('button');
                button.addEventListener('click', function(event) { form.submit(); });
            </script>
        </div>
    </div>
</body>

</html>
